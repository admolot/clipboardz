name: Compile Windows Executable

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Compile with PyInstaller
      run: |
        # Added hidden-imports to properly bundle the win32clipboard modules
        pyinstaller --noconsole --onefile --hidden-import pywintypes --hidden-import win32clipboard main.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: FIFO_Clipboard_Manager
        path: dist/main.exe
